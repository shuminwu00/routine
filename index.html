<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的作息</title>
<meta name="theme-color" content="#F5F8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的作息">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1DB866;
  --bg:#F5F8F4; --surface:#FFFFFF; --ink:#1E2B22; --muted:#7C877F; --line:#E4EAE4;
  --lime:#E7F9CF; --sky:#D7F1FB; --chip:#EEF2EE; --shadow:0 1px 0 rgba(30,43,34,.04);
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --accent-ink:color-mix(in srgb,var(--accent) 70%,#0c2414);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-size:15px;
}
:root[data-fs="s"]{font-size:13.5px} :root[data-fs="l"]{font-size:16.5px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121714;--surface:#1B221D;--ink:#E8EEE9;--muted:#8E9A91;--line:#2A342D;--lime:#24321C;--sky:#1A2E36;--chip:#242D27;--accent-ink:color-mix(in srgb,var(--accent) 60%,#fff)}
}
:root[data-theme="dark"]{--bg:#121714;--surface:#1B221D;--ink:#E8EEE9;--muted:#8E9A91;--line:#2A342D;--lime:#24321C;--sky:#1A2E36;--chip:#242D27;--accent-ink:color-mix(in srgb,var(--accent) 60%,#fff)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-family:"Nunito","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 18px 110px}
h1{font-size:1.45rem;font-weight:900;margin:22px 0 14px;letter-spacing:-.01em}
.muted{color:var(--muted)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.month{font-size:1.3rem;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--chip);font-weight:700;font-size:.9rem}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--chip);font-size:1.1rem}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 18px;align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 9px;border-radius:22px}
.day .wd{font-size:.8rem;color:var(--muted);font-weight:700}
.ring{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--chip)}
.ring span{position:relative;z-index:1;font-weight:800;font-size:.95rem;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.day.sel{background:var(--ink)} .day.sel .wd{color:var(--surface)}
.day.future .ring span{color:var(--muted)}
.day.today .wd{color:var(--accent)}
/* segmented tabs */
.tabs{display:flex;background:var(--chip);border-radius:18px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 0;border-radius:14px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.92rem;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface)}
.chip.sel{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.selchip{display:inline-flex;align-items:center;gap:2px}
.selchip select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font-weight:700;padding:0;outline:none}
.hcard.hl{background:var(--hlc,#FFF3A3);border-color:transparent}
.gc button,.gh,.hcard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lv{flex:none;display:inline-block;font-family:"Nunito",sans-serif;font-size:.66rem;font-weight:900;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);line-height:1.3}
.cell.two{gap:1px;font-size:1rem;line-height:1}
.cell.two small{font-size:.6rem;font-weight:800;color:var(--ink)}
.hlprev{display:grid;grid-template-columns:1fr 2.2fr 48px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.hlprev span{background:var(--hlc);padding:10px;border-right:1px solid rgba(30,43,34,.1);font-size:.86rem;color:#1E2B22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlprev span:last-child{border-right:0;text-align:center}
.lvin{display:flex;align-items:center;gap:8px}
.grid>.rh{cursor:pointer;font-weight:700}
.grid>.rh:not(.hl){background:var(--lime)}
.grid>.gh.rs{padding-left:20px}
.grid>.gi.rs{color:var(--muted)}
.rplay{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:.72rem;display:grid;place-items:center}
.rprog{display:grid;place-items:center;line-height:1;gap:2px;font-size:1rem}
.rprog small{font-size:.62rem;font-weight:800}
.rprog.ok small{color:var(--accent-ink)}
.rlabel{text-align:left;background:var(--lime);border-radius:14px;padding:8px 12px;color:var(--ink);display:flex;justify-content:space-between}
.addbox{width:100%;border:1.5px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-weight:600;margin-top:10px}
.info p{line-height:1.75;font-size:.95rem;margin:10px 2px}
.info h3{font-size:1.02rem;margin:24px 2px 10px}
.ibox{background:var(--surface);border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ibox.col{flex-direction:column;gap:8px}
.itag{padding:9px 16px;border-radius:14px;background:var(--bg);font-weight:700}
.itag.dark{background:var(--ink);color:var(--surface)}
.ipill{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:999px;padding:7px 18px 7px 7px;font-weight:700;min-width:170px}
.ipill b{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:.8rem;flex:none}
.ipill.hl{color:#2F6FEB} .ipill.hl b{background:#2F6FEB;color:#fff}
.lvin .lv{width:44px;text-align:center}
.row-btn{width:100%;text-align:left;gap:10px}
.row-btn .lb{flex:1;min-width:0}
.rv{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.rv.ph{color:var(--muted)}
.ck{color:var(--accent);font-weight:900;margin-left:6px}
.switch{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(20px)}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 2px;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:3px}
.bi{width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:1.3rem;filter:grayscale(1);opacity:.45}
.badge.on .bi{background:var(--accent-soft);filter:none;opacity:1;box-shadow:0 0 0 2px var(--accent)}
.bl{font-size:.76rem;font-weight:800} .bp{font-size:.68rem;color:var(--muted)}
.bsub{font-size:.82rem;margin:4px 0 8px}
.cele{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92%,520px);background:var(--sky);border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.cele.show{opacity:1;transform:translate(-50%,0)} .cele .ce-ic{font-size:2rem}
/* habit table */
.grid{display:grid;grid-template-columns:26px minmax(60px,.85fr) 2.5fr 58px;gap:0;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.grid>*{border-bottom:1px solid var(--line);min-height:54px;display:flex;align-items:center}
.grid>.last{border-bottom:0}
.grid>.hl{background:var(--hlc,#FFF3A3)}
:root[data-theme="dark"] .grid>.hl,:root[data-theme="dark"] .hcard.hl{background:color-mix(in srgb,var(--hlc,#FFF3A3) 22%,var(--surface))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grid>.hl,:root:not([data-theme="light"]) .hcard.hl{background:color-mix(in srgb,var(--hlc,#FFF3A3) 22%,var(--surface))}}
.gi{justify-content:center;color:var(--muted);font-size:.85rem;background:var(--bg)}
.gg{padding:0 8px;font-size:.82rem;font-weight:500;border-right:1px solid var(--line);line-height:1.3;word-break:break-all}
.gh{padding:0 8px 0 10px;gap:7px;border-right:1px solid var(--line);text-align:left;width:100%;min-width:0;height:100%}
.gh .fl{flex:none;width:48px;display:flex;justify-content:flex-end}
.gh .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.gh .em{font-size:1.15rem;flex:none}
.gc{justify-content:center}
.flame{flex:none;display:inline-flex;align-items:center;gap:2px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:.8rem;font-weight:800}
.flame.hot{background:#FFE7E0;color:#E4572E}
:root[data-theme="dark"] .flame.hot{background:#3a221b}
.cell{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:.85rem;border:2px dashed var(--line);color:var(--muted);line-height:1.1;text-align:center}
.cell.done{border:0;font-size:1.35rem}
.cell.part{border-style:solid;border-color:var(--hc,var(--accent))}
.cell.val{border:0;background:var(--hsoft);color:var(--ink);font-size:.82rem}
/* cards view */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{background:var(--surface);border-radius:24px;padding:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:10px;text-align:left}
.hcard.done{background:var(--hsoft);border-color:transparent}
.hcard .row{display:flex;justify-content:space-between;align-items:center}
.hcard .em{font-size:1.6rem}
.hcard .nm{font-weight:700;line-height:1.3}
.hcard .sub{font-size:.85rem;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hc,var(--accent));border-radius:9px}
.glabel{grid-column:1/-1;font-size:.85rem;font-weight:700;color:var(--muted);margin:8px 4px 0}
/* empty */
.empty{background:var(--surface);border-radius:26px;padding:26px 20px;text-align:center;border:1.5px dashed var(--line)}
.empty h3{margin:.2rem 0 .4rem;font-size:1.15rem}
.starter{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.starter button{padding:9px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.9rem;border:2px solid transparent}
.starter button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;padding:13px 20px;border-radius:18px;background:var(--accent);color:#fff;font-weight:700}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:#E0463A}
.btn.block{width:100%;flex:initial}
.btn:disabled{opacity:.45}
/* todos */
.todo{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.todo .tt{flex:1}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-size:.9rem}
.tick.on{background:var(--accent);border-color:var(--accent)}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.input{width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.input:focus{border-color:var(--accent)}
.sec-title{font-weight:800;font-size:.95rem;margin:18px 4px 8px;color:var(--muted)}
/* fab */
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:2rem;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);z-index:20}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .22s}
.scrim.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-head h2{margin:0;font-size:1.2rem;font-weight:900}
.group{background:var(--surface);border-radius:22px;padding:4px 16px;margin-bottom:12px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label,.field .lb{font-weight:700;flex:none}
.field.col{flex-direction:column;align-items:stretch}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:12px;background:var(--chip);font-weight:600;font-size:.88rem}
.seg button.on{background:var(--ink);color:var(--surface)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.mini{width:88px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:right}
select.mini{width:auto;text-align:left}
.emo-in{width:54px;height:54px;font-size:1.7rem;text-align:center;border-radius:18px;border:1.5px solid var(--line);background:var(--surface)}
.emo-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.emo-row button{font-size:1.3rem;width:36px;height:36px;border-radius:10px}
.emo-row button:hover{background:var(--chip)}
/* log sheet */
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0}
.stepper button{width:58px;height:58px;border-radius:20px;background:var(--surface);font-size:1.8rem;font-weight:800}
.stepper .big{font-size:3rem;font-weight:900;min-width:90px;text-align:center}
.rate{display:flex;justify-content:center;gap:10px;margin:18px 0}
.rate button{width:52px;height:52px;border-radius:18px;background:var(--surface);font-size:1.6rem;filter:grayscale(1);opacity:.5}
.rate button.on{filter:none;opacity:1;background:var(--accent-soft)}
/* stats */
.card{background:var(--surface);border-radius:26px;padding:18px;margin-bottom:12px;border:1.5px solid var(--line)}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-size:1.9rem;font-weight:900;line-height:1.1}
.kpi small{color:var(--muted);font-size:.8rem;font-weight:600}
.mnav{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 14px;font-weight:900;font-size:1.2rem}
.mnav button{width:36px;height:36px;border-radius:12px;background:var(--chip);font-size:1rem}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat div{aspect-ratio:1;border-radius:8px;background:var(--chip);font-size:.68rem;display:grid;place-items:center;color:var(--muted);font-weight:700}
.heat div.blank{background:transparent}
.heat div.off{opacity:.35}
.heat .hd{background:transparent;aspect-ratio:auto;padding-bottom:2px}
.hstat{display:flex;gap:14px;margin-top:12px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.hstat b{color:var(--ink);font-size:1.05rem}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;border-radius:10px 10px 6px 6px;background:var(--accent);min-height:4px}
.bars .b.low i{background:#F4A3A3}
.bars .b span{font-size:.75rem;color:var(--muted);font-weight:700}
.hbar{display:grid;grid-template-columns:72px 1fr 42px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.matrix{display:grid;gap:6px 4px;align-items:center}
.matrix .mc{aspect-ratio:1;border-radius:8px;background:var(--chip);max-width:30px;width:100%;justify-self:center}
.matrix .mh{font-size:.75rem;color:var(--muted);text-align:center;font-weight:700}
.matrix .mn{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.insight{background:var(--lime);border-radius:18px;padding:12px 14px;font-size:.92rem;margin-top:12px;line-height:1.55}
svg text{font-family:"Nunito",sans-serif}
/* routines */
.rcard{background:var(--surface);border-radius:26px;padding:16px;margin-bottom:12px;border:1.5px solid var(--line)}
.rcard .rt{display:flex;align-items:center;gap:12px}
.rcard .rt .em{font-size:2rem;width:52px;height:52px;border-radius:18px;background:var(--lime);display:grid;place-items:center}
.rcard .steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.rcard .steps span{background:var(--chip);border-radius:10px;padding:5px 9px;font-size:.82rem}
.stepedit{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.stepedit:last-child{border-bottom:0}
.stepedit .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepedit button{width:32px;height:32px;border-radius:10px;background:var(--chip);font-size:.9rem}
/* timer */
.timer{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.timer.open{display:flex}
.timer .close{align-self:flex-start}
.timer .cur{font-size:4rem;margin-top:24px}
.timer .cname{font-size:1.4rem;font-weight:900;margin-top:6px}
.timer .clock{font-size:4.6rem;font-weight:900;margin:12px 0 4px;letter-spacing:-.02em}
.timer .tbar{width:100%;max-width:340px;height:10px;border-radius:10px;background:var(--chip);overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.tctl{display:flex;align-items:center;gap:30px;margin:30px 0}
.tctl button{width:60px;height:60px;border-radius:50%;background:var(--chip);font-size:1.4rem;display:grid;place-items:center}
.tctl .go{width:86px;height:86px;background:var(--accent);color:#fff;font-size:2.2rem;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.tlist{width:100%;max-width:380px}
.tlist div{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;margin-bottom:4px;font-size:.95rem}
.tlist div.now{background:var(--surface);font-weight:700}
.tlist div.fin{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:14px;font-size:.9rem;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab" aria-label="新增">+</button>
<nav><div class="in" id="nav"></div></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="timer" id="timer"></div>
<div class="toast" id="toast"></div>
<div class="cele" id="cele" role="status"></div>

<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const ymOf=s=>s.slice(0,7);
const todayS=()=>ds(new Date());
const WD=['日','一','二','三','四','五','六'];
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

const HCOLORS=['#8FB3E8','#FFD166','#7FD8A0','#F4A3A3','#C3A6F2','#7DD3E8','#F7B267','#B8C0BA'];
const ACCENTS=[['綠','#1DB866'],['藍','#3B82F6'],['珊瑚','#F0735A'],['紫','#8B5CF6'],['琥珀','#D99A00'],['墨','#334155']];
const TYPES={check:'打勾',count:'次數',number:'數值',time:'時間',rating:'評分',note:'備註'};
const EMOS=['💧','🥛','🍋','💪','🧘','🏃','📚','⚖️','☀️','🌙','🙂','🦷','🥗','💊','🚶','✍️','🧹','🎨','🎬','😴'];
const RATE=['😣','🙁','😐','🙂','😄'];
const LV=[null,['Mini','#1DB866'],['Plus','#3B82F6'],['Max','#E4572E']];
const HLCOLORS=['#FFF3A3','#FFD6D6','#FFE0C2','#E6F7B8','#D2F0FB','#DCDDF2','#F3D9F7','#FFFBE0','#FFE9E9','#FFF1E3','#EDF8E4','#E6F4FC','#EFEFF8','#FAEEFA'];
const firstG=str=>{str=(str||'').trim();if(!str)return '';try{const it=new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(str)[Symbol.iterator]().next();return it.done?'':it.value.segment}catch(e){return [...str].slice(0,2).join('')}};
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};

/* ============ state ============ */
const DEFAULT_CFG={v:4,groups:['起床後','上午','中午','下午','晚上','睡前','通勤'],categories:['💪健康管理','🧠自我管理','🏠生活','📚學習成長'],achievements:{},habits:[],routines:[],todos:[],
  settings:{accent:'#1DB866',theme:'auto',fs:'m',view:'table',weekStart:0}};
const S={cfg:clone(DEFAULT_CFG),logs:{},ui:{tab:'today',sel:todayS(),todayTab:'habits',cf:null,ff:'all',statsMonth:ymOf(todayS()),statsMode:'month',starter:new Set()}};

/* ============ storage (cloud db + local cache) ============ */
const Store={db:null,uid:null,cloud:false,status:'本機',
  base(){return 'data/users/'+this.uid},
  async init(){
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const id=await user.id(); if(!id)return;
      this.db=db;this.uid=id;this.cloud=true;this.status='雲端同步';
    }catch(e){}
  },
  localGet(k){try{const v=localStorage.getItem('mr_'+k);return v?JSON.parse(v):null}catch(e){return null}},
  localSet(k,v){try{localStorage.setItem('mr_'+k,JSON.stringify(v))}catch(e){}},
  async cloudGet(name){try{const s=await this.db.doc(this.base()+'/'+name).get();return s.exists?s.data():null}catch(e){return undefined}},
  timers:{},busy:{},again:{},
  save(name,getter){
    this.localSet(name,getter());
    if(!this.cloud)return;
    clearTimeout(this.timers[name]);
    this.timers[name]=setTimeout(()=>this.flush(name,getter),700);
  },
  async flush(name,getter){
    if(this.busy[name]){this.again[name]=getter;return}
    this.busy[name]=true;
    try{await this.db.doc(this.base()+'/'+name).set(clone(getter()))}
    catch(e){
      if(e&&e.code==='quota_exceeded')toast('雲端空間已滿，資料暫存在這台裝置');
      else if(e&&e.code==='unavailable'){setTimeout(()=>this.flush(name,getter),1500)}
      else if(e&&(e.code==='revoked'||e.code==='invalid_argument')){this.cloud=false;this.status='本機（雲端無法寫入）';}
    }
    this.busy[name]=false;
    if(this.again[name]){const g=this.again[name];delete this.again[name];this.flush(name,g)}
  }
};
const saveCfg=()=>Store.save('config',()=>S.cfg);
const saveMonth=ym=>Store.save('log-'+ym,()=>S.logs[ym]);

async function loadMonth(ym){
  if(S.logs[ym])return;
  const local=Store.localGet('log-'+ym)||{days:{}};
  S.logs[ym]=local;
  if(Store.cloud){
    const c=await Store.cloudGet('log-'+ym);
    if(c&&c.days){S.logs[ym]={days:c.days};Store.localSet('log-'+ym,S.logs[ym])}
    else if(c===null&&Object.keys(local.days||{}).length){saveMonth(ym)}
  }
}
function monthsBack(fromYm,n){const out=[];let [y,m]=fromYm.split('-').map(Number);for(let i=0;i<n;i++){out.push(y+'-'+pad(m));m--;if(!m){m=12;y--}}return out}

/* ============ habit logic ============ */
const H=id=>S.cfg.habits.find(h=>h.id===id);
const activeHabits=()=>S.cfg.habits.filter(h=>!h.archived);
function getVal(date,hid){const L=S.logs[ymOf(date)];return L&&L.days&&L.days[date]?L.days[date][hid]:undefined}
function setVal(date,hid,v){
  const ym=ymOf(date);if(!S.logs[ym])S.logs[ym]={days:{}};
  const days=S.logs[ym].days||(S.logs[ym].days={});
  const empty=v===undefined||v===null||v===''||v===false||(typeof v==='number'&&isNaN(v));
  if(empty){if(days[date]){delete days[date][hid];if(!Object.keys(days[date]).length)delete days[date]}}
  else{(days[date]||(days[date]={}))[hid]=v}
  saveMonth(ym);
  if(!empty)checkAch();
}
function isDone(h,v){
  if(v===undefined||v===null)return false;
  switch(h.type){
    case 'check':return v===true||(!!v&&typeof v==='object'&&!!v.d);
    case 'count':return Number(v)>=(h.target||1);
    case 'note':return typeof v==='string'&&v.trim()!=='';
    default:return v!=='';
  }
}
function scheduled(h,date){
  if(h.createdAt&&date<h.createdAt)return false;
  const r=h.repeat||{mode:'daily'};
  if(r.mode==='days')return (r.days||[]).includes(pd(date).getDay());
  return true;
}
function weekStartOf(date){const d=pd(date);const off=(d.getDay()-S.cfg.settings.weekStart+7)%7;d.setDate(d.getDate()-off);return ds(d)}
function weekCount(h,date){const s=weekStartOf(date);let c=0;for(let i=0;i<7;i++){if(isDone(h,getVal(addD(s,i),h.id)))c++}return c}
function streak(h,upto){
  const r=h.repeat||{mode:'daily'};let n=0;
  if(r.mode==='weekly'){
    let ws=weekStartOf(upto);const need=r.n||1;
    if(weekCount(h,ws)<need)ws=addD(ws,-7);
    for(let i=0;i<30;i++){if(h.createdAt&&addD(ws,6)<h.createdAt)break;if(weekCount(h,ws)>=need){n++;ws=addD(ws,-7)}else break}
    return {n,unit:'週'};
  }
  let d=upto;
  if(scheduled(h,d)&&!isDone(h,getVal(d,h.id)))d=addD(d,-1);
  for(let i=0;i<120;i++){
    if(h.createdAt&&d<h.createdAt)break;
    if(!scheduled(h,d)){d=addD(d,-1);continue}
    if(isDone(h,getVal(d,h.id))){n++;d=addD(d,-1)}else break;
  }
  return {n,unit:'天'};
}
function dayProgress(date){
  let tot=0,done=0;
  activeHabits().forEach(h=>{if((h.repeat||{}).mode==='weekly')return;if(!scheduled(h,date))return;tot++;if(isDone(h,getVal(date,h.id)))done++});
  return tot?done/tot:0;
}
const cv=v=>v&&typeof v==='object'?v:(v===true?{d:true}:null);
const lvOn=h=>h.type==='check'&&h.levels&&h.levels.on;
function levelName(h,l){const L=h.levels||{};return l===1?(L.mini||h.name):l===2?L.plus:L.max}
function makeCheck(h,{l,t,n}={}){
  const trk=h.type==='check'?h.track:'';
  if(!l&&!trk)return true;
  const o={d:true};if(l)o.l=l;
  if(trk==='time')o.t=t||nowHM();
  if(trk==='number'&&n!==undefined&&n!==null&&n!=='')o.n=Number(n);
  return o;
}
function trackVal(h,v){
  if(v===undefined||v===null||v==='')return undefined;
  if(h.type==='check'){const o=cv(v);if(!o)return undefined;return h.track==='time'?o.t:h.track==='number'?o.n:undefined}
  return (h.type==='number'||h.type==='time'||h.type==='rating')?v:undefined;
}
function checkCell(h,v){const o=cv(v)||{};const sub=o.t||(o.n!=null?o.n:'');
  return `<span class="cell done ${sub!==''?'two':''}"><span>${esc(h.emoji)}</span>${sub!==''?`<small class="num">${esc(sub)}</small>`:''}</span>`}
function displayVal(h,v){
  if(v===undefined||v===null||v==='')return '';
  if(h.type==='count')return v+'/'+(h.target||1);
  if(h.type==='number')return v+(h.unit?`<small>${esc(h.unit)}</small>`:'');
  if(h.type==='time')return esc(v);
  if(h.type==='rating')return RATE[v-1]||v;
  if(h.type==='note')return '📝';
  return '';
}
const soft=c=>`color-mix(in srgb,${c} 28%,var(--surface))`;

/* ============ theme ============ */
function applyTheme(){
  const st=S.cfg.settings,r=document.documentElement;
  r.style.setProperty('--accent',st.accent);
  if(st.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',st.theme);
  r.setAttribute('data-fs',st.fs);
}

/* ============ nav ============ */
const ICONS={
  today:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></svg>',
  routine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" opacity=".25"/><rect x="7.5" y="11" width="2.4" height="6" rx="1.2"/><rect x="11" y="7" width="2.4" height="10" rx="1.2"/><rect x="14.5" y="9.5" width="2.4" height="7.5" rx="1.2"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>'
};
function renderNav(){
  const items=[['today','今天'],['routine','作息'],['stats','統計'],['settings','設定']];
  $('#nav').innerHTML=items.map(([k,l])=>`<button data-nav="${k}" class="${S.ui.tab===k?'on':''}">${ICONS[k]}${l}</button>`).join('');
  $('#fab').style.display=(S.ui.tab==='today'||S.ui.tab==='routine')?'grid':'none';
}

/* ============ TODAY ============ */
function renderToday(){
  const sel=S.ui.sel,today=todayS();
  const ws=weekStartOf(sel);
  const d=pd(sel);
  let h=`<div class="top"><button class="month num" data-act="gotoToday">${d.getFullYear()}年${d.getMonth()+1}月</button>
    <div style="display:flex;gap:8px"><button class="iconbtn" data-act="week" data-d="-7" aria-label="上一週">‹</button><button class="iconbtn" data-act="week" data-d="7" aria-label="下一週">›</button></div></div>`;
  h+='<div class="week">';
  for(let i=0;i<7;i++){
    const dd=addD(ws,i),p=dayProgress(dd),fut=dd>today;
    const bg=fut?'var(--chip)':`conic-gradient(var(--accent) ${p*360}deg, var(--chip) 0)`;
    h+=`<button class="day ${dd===sel?'sel':''} ${fut?'future':''} ${dd===today?'today':''}" data-act="selDay" data-date="${dd}">
      <span class="wd">${WD[pd(dd).getDay()]}</span><span class="ring" style="background:${bg}"><span class="num">${pd(dd).getDate()}</span></span></button>`;
  }
  h+='</div>';
  const pend=S.cfg.todos.filter(t=>t.date===sel&&!t.done).length;
  h+=`<div class="tabs"><button class="${S.ui.todayTab==='habits'?'on':''}" data-act="todayTab" data-v="habits">日常習慣</button><button class="${S.ui.todayTab==='todos'?'on':''}" data-act="todayTab" data-v="todos">待辦事項${pend?` (${pend})`:''}</button></div>`;
  const le=S.cfg.settings.lastExport;if(activeHabits().length&&(!le||(pd(today)-pd(le))/864e5>=7))h+=`<button class="insight" style="width:100%;text-align:left;margin:0 0 12px" data-act="export">💾 ${le?'距離上次備份已超過 7 天':'還沒備份過'}，點這裡匯出一份</button>`;
  h+=S.ui.todayTab==='habits'?renderHabitList():renderTodos();
  return h;
}
function orderedHabits(date){
  const g=S.cfg.groups;
  let list=activeHabits().filter(h=>!(h.createdAt&&date<h.createdAt)&&((h.repeat||{}).mode==='weekly'||scheduled(h,date)));
  if(S.ui.cf)list=list.filter(h=>(h.category||'')===S.ui.cf);
  if(S.ui.ff==='daily')list=list.filter(h=>(h.repeat||{}).mode!=='weekly');
  if(S.ui.ff==='weekly')list=list.filter(h=>(h.repeat||{}).mode==='weekly');
  const gi=x=>{const i=g.indexOf(x.group);return i<0?999:i};
  return list.sort((a,b)=>gi(a)-gi(b)||(b.importance||1)-(a.importance||1)||(a.order||0)-(b.order||0));
}
function flameHTML(x,sel){
  if(x.showStreak===false)return '<span class="fl"></span>';
  if((x.repeat||{}).mode==='weekly'){const c=weekCount(x,sel),n=x.repeat.n||1;return `<span class="fl"><span class="flame num ${c>=n?'hot':''}">${c}/${n}</span></span>`}
  const st=streak(x,sel);return `<span class="fl"><span class="flame num ${st.n?'hot':''}">🔥${st.n}</span></span>`;
}
function buildEntries(date){
  const vis=h=>!(h.createdAt&&date<h.createdAt)&&((h.repeat||{}).mode==='weekly'||scheduled(h,date))
    &&(!S.ui.cf||(h.category||'')===S.ui.cf)&&(S.ui.ff==='all'||(S.ui.ff==='weekly')===((h.repeat||{}).mode==='weekly'));
  const inR=new Set(),out=[];
  S.cfg.routines.forEach((r,ri)=>{const steps=r.steps.map(s=>H(s.hid)).filter(h=>h&&!h.archived);steps.forEach(h=>inR.add(h.id));const vs=steps.filter(vis);if(vs.length)out.push({r,ri,steps:vs,group:r.group||''})});
  activeHabits().filter(h=>!inR.has(h.id)&&vis(h)).forEach(h=>out.push({h,group:h.group||''}));
  const g=S.cfg.groups,gi=x=>{const i=g.indexOf(x);return i<0?999:i};
  return out.sort((a,b)=>gi(a.group)-gi(b.group)||(a.r?0:1)-(b.r?0:1)||(a.r&&b.r?a.ri-b.ri:0)||(!a.r&&!b.r?((b.h.importance||1)-(a.h.importance||1)||(a.h.order||0)-(b.h.order||0)):0));
}
function habitCells(x,num,sel,cls,step){
  const v=getVal(sel,x.id),dn=isDone(x,v);
  let cell;
  if(x.type==='check')cell=dn?checkCell(x,v):`<span class="cell"></span>`;
  else if(x.type==='count')cell=dn?`<span class="cell done">${esc(x.emoji)}</span>`:`<span class="cell ${v?'part':''} num">${v||0}/${x.target||1}</span>`;
  else cell=(v!==undefined&&v!=='')?`<span class="cell val num">${displayVal(x,v)}</span>`:`<span class="cell">＋</span>`;
  const hs=x.highlight?` style="--hlc:${x.hlColor||'#FFF3A3'}"`:'';
  const o=x.type==='check'?cv(v):null,lvl=(lvOn(x)&&o&&o.d)?(o.l||1):0;
  const nmHTML=lvl?`<span class="lv" style="--c:${LV[lvl][1]}">${LV[lvl][0]}</span><span class="nm">${esc(levelName(x,lvl))}</span>`:`<span class="nm">${esc(x.name)}</span>`;
  return `<div class="gi num${cls}"${hs}>${num}</div><div class="gg${cls}"${hs}>${step?'':esc(x.group||'')}</div>
      <button class="gh${cls}"${hs} data-act="edit" data-id="${x.id}"><span class="em">${esc(x.emoji)}</span>${nmHTML}${flameHTML(x,sel)}</button>
      <div class="gc${cls}"${hs}><button data-act="log" data-id="${x.id}" style="--hc:${x.color};--hsoft:${soft(x.color)}" aria-label="記錄 ${esc(x.name)}">${cell}</button></div>`;
}
function routineProg(e,sel){const n=e.steps.length,d=e.steps.filter(h=>isDone(h,getVal(sel,h.id))).length;return {n,d}}
function routineCells(e,sel,cls){
  const r=e.r,{n,d}=routineProg(e,sel);
  const c=' rh'+cls+(r.highlight?' hl':''),hs=r.highlight?` style="--hlc:${r.hlColor||'#FFF3A3'}"`:'',a=`data-act="rtog" data-id="${r.id}"`;
  return `<div class="gi${c}"${hs} ${a}>${r.collapsed?'▸':'▾'}</div><div class="gg${c}"${hs} ${a}>${esc(r.group||'')}</div>
    <div class="gh${c}"${hs} ${a} role="button" tabindex="0" aria-expanded="${!r.collapsed}"><span class="em">${esc(r.emoji)}</span><span class="nm">${esc(r.name)}</span>${r.timer!==false&&sel===todayS()?`<button class="rplay" data-act="startRoutine" data-id="${r.id}" aria-label="開始計時">▶</button>`:''}</div>
    <div class="gc${c}"${hs} ${a}><span class="rprog ${d===n?'ok':''}"><span>${esc(r.emoji)}</span><small class="num">${d}/${n}</small></span></div>`;
}
function cardHTML(x,sel){
  const v=getVal(sel,x.id),dn=isDone(x,v);
  let prog='';
  if(x.type==='count'){const p=Math.min(1,(Number(v)||0)/(x.target||1));prog=`<div class="bar"><i style="width:${p*100}%"></i></div>`}
  let val=x.type!=='check'&&v!==undefined&&v!==''?' · '+displayVal(x,v):'';
  if(x.type==='check'&&dn){const o=cv(v);if(lvOn(x))val+=' · '+esc(LV[o.l||1][0]+' '+levelName(x,o.l||1));if(o.t)val+=' · '+esc(o.t);if(o.n!=null)val+=' · '+esc(o.n+(x.trackUnit||''))}
  return `<button class="hcard ${dn?'done':''} ${x.highlight?'hl':''}" style="--hc:${x.color};--hsoft:${soft(x.color)};--hlc:${x.hlColor||'#FFF3A3'}" data-act="log" data-id="${x.id}">
    <div class="row"><span class="em">${esc(x.emoji)}</span>${flameHTML(x,sel)}</div>
    <div><div class="nm">${esc(x.name)}</div><div class="sub">${esc(x.group||TYPES[x.type])}${val}</div></div>${prog}</button>`;
}
function renderHabitList(){
  if(!activeHabits().length)return renderStarter();
  const sel=S.ui.sel;
  const usedCats=S.cfg.categories.filter(c=>activeHabits().some(h=>h.category===c));

  h+='<div class="grid">'+rows.map((row,i)=>{const last=i===rows.length-1?' last':'';

  return h+`<p class="sync">點名稱編輯習慣，點右側格子記錄；點作息標題列可收合${hint}</p>`;
}

/* ============ LOG ============ */
function doLog(id){
  const h=H(id),sel=S.ui.sel;
  if(sel>todayS()){toast('還沒到這一天');return}
  const v=getVal(sel,id);
  if(h.type==='check'){
    if(isDone(h,v)){setVal(sel,id,undefined);render();return}
    if(h.track==='number'||(h.track==='time'&&sel!==todayS()))return openCheckSheet(h);
    setVal(sel,id,makeCheck(h,{l:lvOn(h)?1:undefined}));render();return;
  }
  if(h.type==='count'&&!isDone(h,v)){setVal(sel,id,(Number(v)||0)+1);render();return}
  openLogSheet(h);
}
function openCheckSheet(h){
  const sel=S.ui.sel,cur=cv(getVal(sel,h.id))||{},on=lvOn(h);
  const t=cur.t||(sel===todayS()?nowHM():''),n=cur.n??'';
  const lvls=on?[1,2,3].filter(l=>l===1||levelName(h,l)):[];
  const body=`<div class="grab"></div><div class="sh-head"><h2>${esc(h.emoji)} ${esc(h.name)}</h2><span class="muted num">${sel.slice(5).replace('-','/')}</span></div>
   ${h.track==='time'?`<div class="group"><div class="field"><label for="ckT">完成時間</label><span style="display:flex;gap:8px"><input id="ckT" class="mini num" type="time" value="${t}"><button class="btn ghost" style="padding:8px 12px" data-now>現在</button></span></div></div>`:''}
   ${h.track==='number'?`<div class="group"><div class="field"><label for="ckN">數值</label><span><input id="ckN" class="mini num" type="number" inputmode="decimal" step="any" value="${n}"> ${esc(h.trackUnit||'')}</span></div></div>`:''}
   ${on?`<div class="sec-title">今天做哪一級？</div><div class="group">${lvls.map(l=>`<button class="field row-btn" data-lv="${l}"><span class="lb"><span class="lv" style="--c:${LV[l][1]}">${LV[l][0]}</span> ${esc(levelName(h,l))}</span>${cur.d&&(cur.l||1)===l?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`:'<button class="btn block" data-lv="0">完成</button>'}
   <button class="btn ghost block" data-clear style="margin-top:10px">清除紀錄</button>`;
  openSheet(body,sh=>{sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-now')){$('#ckT').value=nowHM();return}
    if(b.hasAttribute('data-clear')){setVal(sel,h.id,undefined);closeSheet();render();return}
    if(b.dataset.lv!==undefined){
      const tv=$('#ckT')?$('#ckT').value:undefined,nv=$('#ckN')?$('#ckN').value:undefined;
      if(h.track==='number'&&(nv===''||nv==null)){toast('請輸入數值');return}
      setVal(sel,h.id,makeCheck(h,{l:on?(Number(b.dataset.lv)||1):undefined,t:tv,n:nv}));closeSheet();render();
    }
  }});

function openLogSheet(h){
  const sel=S.ui.sel;let v=getVal(sel,h.id);
  const body=()=>{
    let inner='';
    if(h.type==='count')inner=`<div class="stepper"><button data-s="-1">−</button><span class="big num" id="lv">${Number(v)||0}</span><button data-s="1">＋</button></div><p class="muted" style="text-align:center">目標 ${h.target||1} ${esc(h.unit||'次')}</p>`;
    if(h.type==='number')inner=`<div class="group"><div class="field"><label for="lvIn">數值</label><span><input id="lvIn" class="mini num" type="number" inputmode="decimal" step="any" value="${v??''}"> ${esc(h.unit||'')}</span></div></div>`;
    if(h.type==='time')inner=`<div class="group"><div class="field"><label for="lvIn">時間</label><span style="display:flex;gap:8px"><input id="lvIn" class="mini num" type="time" value="${v??''}"><button class="btn ghost" style="padding:8px 12px" data-now>現在</button></span></div></div>`;
    if(h.type==='rating')inner=`<div class="rate">${RATE.map((e,i)=>`<button class="${v===i+1?'on':''}" data-r="${i+1}">${e}</button>`).join('')}</div>`;
    if(h.type==='note')inner=`<textarea id="lvIn" class="input" rows="5" placeholder="寫點什麼…">${esc(v??'')}</textarea>`;
    return `<div class="grab"></div><div class="sh-head"><h2>${esc(h.emoji)} ${esc(h.name)}</h2><span class="muted num">${sel.slice(5).replace('-','/')}</span></div>${inner}
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" data-clear style="flex:1">清除紀錄</button><button class="btn" data-ok style="flex:2">儲存</button></div>`;
  };
  openSheet(body(),sh=>{
    sh.onclick=e=>{
      const t=e.target.closest('button');if(!t)return;
      if(t.dataset.s){v=Math.max(0,(Number(v)||0)+Number(t.dataset.s));$('#lv').textContent=v}
      if(t.dataset.r){v=Number(t.dataset.r);sh.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b===t))}
      if(t.hasAttribute('data-now')){const n=new Date();$('#lvIn').value=pad(n.getHours())+':'+pad(n.getMinutes())}
      if(t.hasAttribute('data-clear')){setVal(sel,h.id,undefined);closeSheet();render()}
      if(t.hasAttribute('data-ok')){
        if(h.type==='number'){const x=$('#lvIn').value;v=x===''?undefined:Number(x)}
        if(h.type==='time'||h.type==='note')v=$('#lvIn').value;
        if(h.type==='count'&&!v)v=undefined;
        setVal(sel,h.id,v);closeSheet();render();
      }
    };
  });
}

    else if(f==='goal')h.goal=val===''?undefined:(h.type==='number'?Number(val):val);
    else if(f.startsWith('lv_'))h.levels[f.slice(3)]=val;
    else h[f]=val;})};
  openSheet(draw(),sh=>{
    sh.onclick=e=>{
      const t=e.target.closest('button');if(!t)return;
      sync(sh);
      if(t.hasAttribute('data-close'))return closeSheet();
      const D=t.dataset;let keep=true;
      if(D.go){view=D.go;keep=false}
      if(D.emo)h.emoji=D.emo;
      if(D.type){h.type=D.type;h.goal=undefined}
      if(D.cnt)h.target=Math.max(1,(h.target||1)+Number(D.cnt));
      if(D.rep)h.repeat.mode=D.rep;
      if(D.wd){const i=Number(D.wd),a=h.repeat.days;a.includes(i)?a.splice(a.indexOf(i),1):a.push(i)}
      if(D.when!==undefined)h.group=D.when;
      if(D.cat!==undefined)h.category=D.cat;
      if(t.hasAttribute('data-newcat')){const v=sh.querySelector('#newCat').value.trim();if(!v)return;if(!S.cfg.categories.includes(v)){S.cfg.categories.push(v);saveCfg()}h.category=v}
      if(D.imp)h.importance=Number(D.imp);
      if(D.tog)h[D.tog]=!h[D.tog];
      if(D.col)h.color=D.col;
      if(D.hl)h.hlColor=D.hl;
      if(t.hasAttribute('data-lvtog'))h.levels.on=!h.levels.on;
      if(t.hasAttribute('data-trktog'))h.track=h.track?'':'time';
      if(D.trk)h.track=D.trk;
      if(t.hasAttribute('data-save')){
        if(!h.name.trim()){toast('請輸入習慣名稱');return}
        if(h.repeat.mode==='days'&&!h.repeat.days.length){toast('重複週期至少選一天');return}
        h.name=h.name.trim();h.emoji=firstG(h.emoji)||'✅';h.group=(h.group||'').trim();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(h.createdAt||''))h.createdAt=todayS();
        ['mini','plus','max'].forEach(k=>h.levels[k]=(h.levels[k]||'').trim());
        if(h.group&&!S.cfg.groups.includes(h.group))S.cfg.groups.push(h.group);
        if(isNew){h.order=S.cfg.habits.length;S.cfg.habits.push(h)}else{S.cfg.habits[S.cfg.habits.findIndex(x=>x.id===h.id)]=h}
        saveCfg();closeSheet();render();toast(isNew?'已新增習慣':'已儲存');return;
      }
      if(t.hasAttribute('data-arch')){H(h.id).archived=true;saveCfg();closeSheet();render();toast('已封存，可在設定中還原');return}
      if(t.hasAttribute('data-del')){if(!confirm(`刪除「${h.name}」？過去的紀錄不會出現在統計中。`))return;S.cfg.habits=S.cfg.habits.filter(x=>x.id!==h.id);S.cfg.routines.forEach(r=>r.steps=r.steps.filter(s=>s.hid!==h.id));saveCfg();closeSheet();render();return}
      const st=keep?sh.scrollTop:0;sh.innerHTML=draw();sh.scrollTop=st;
    };
  });
}

/* ============ ACHIEVEMENTS ============ */
const MS_STREAK=[7,21,30,66,100],MS_TOTAL=[10,50,100],MS_PERFECT=[1,7,30,100];
function allDates(){const s=new Set();for(const ym in S.logs)Object.keys((S.logs[ym]&&S.logs[ym].days)||{}).forEach(d=>s.add(d));return [...s]}
function totalDone(h){let n=0;for(const ym in S.logs){const days=(S.logs[ym]&&S.logs[ym].days)||{};for(const d in days)if(isDone(h,days[d][h.id]))n++}return n}
function isPerfect(d){let tot=0,dn=0;activeHabits().forEach(h=>{if((h.repeat||{}).mode==='weekly'||!scheduled(h,d))return;tot++;if(isDone(h,getVal(d,h.id)))dn++});return tot>0&&dn===tot}
function perfectDays(){const t=todayS();return allDates().filter(d=>d<=t&&isPerfect(d)).length}
function checkAch(){
  const A=S.cfg.achievements||(S.cfg.achievements={}),today=todayS(),newly=[];
  const unlock=(k,item)=>{if(!A[k]){A[k]=today;newly.push(item)}};
  activeHabits().forEach(h=>{
    if((h.repeat||{}).mode!=='weekly'){const s=streak(h,today).n;MS_STREAK.forEach(m=>{if(s>=m)unlock(`s:${h.id}:${m}`,{icon:'🔥',title:`${h.emoji} ${h.name}`,desc:`連續 ${m} 天`})})}
    const t=totalDone(h);MS_TOTAL.forEach(m=>{if(t>=m)unlock(`t:${h.id}:${m}`,{icon:'🏅',title:`${h.emoji} ${h.name}`,desc:`累計完成 ${m} 次`})});
  });
  const p=perfectDays();MS_PERFECT.forEach(m=>{if(p>=m)unlock(`p:${m}`,{icon:'🌟',title:'全勤日',desc:m===1?'第一次全部完成':`累計 ${m} 天全部完成`})});
  if(newly.length){saveCfg();celebrate(newly)}
}
const celQ=[];let celBusy=false;
function celebrate(items){celQ.push(...items);if(!celBusy)nextCel()}
function nextCel(){const c=$('#cele');if(!celQ.length){celBusy=false;return}celBusy=true;const it=celQ.shift();
  c.innerHTML=`<span class="ce-ic">${it.icon}</span><div><b>解鎖成就：${esc(it.desc)}</b><div class="muted" style="font-size:.88rem">${esc(it.title)}　大棒了！👏</div></div>`;
  c.classList.add('show');if(navigator.vibrate)navigator.vibrate(60);
  setTimeout(()=>{c.classList.remove('show');setTimeout(nextCel,350)},2600)}
function renderAchievements(){
  const A=S.cfg.achievements||{},today=todayS(),hs=activeHabits(),p=perfectDays();
  const badge=(on,icon,label,prog)=>`<div class="badge ${on?'on':''}"><span class="bi">${icon}</span><span class="bl num">${label}</span><span class="bp num">${on?'已解鎖':prog}</span></div>`;
  const best=Math.max(0,...hs.map(x=>(x.repeat||{}).mode==='weekly'?0:streak(x,today).n));
  let h=`<div class="card"><div class="kpis"><div class="kpi"><b class="num">${Object.keys(A).length}</b><small>已解鎖成就</small></div><div class="kpi"><b class="num">${p}</b><small>全勤天數</small></div><div class="kpi"><b class="num">${best}</b><small>最長連續中</small></div></div></div>`;
  h+=`<div class="card"><h3>🌟 全勤日</h3><div class="bsub muted">當天排定的習慣全部完成</div><div class="badges">${MS_PERFECT.map(m=>badge(A['p:'+m],'🌟',m+'天',`${Math.min(p,m)}/${m}`)).join('')}</div></div>`;
  hs.forEach(x=>{const wk=(x.repeat||{}).mode==='weekly',s=wk?0:streak(x,today).n,t=totalDone(x);
    h+=`<div class="card"><h3>${esc(x.emoji)} ${esc(x.name)}</h3>${wk?'':`<div class="bsub muted">連續天數（目前 ${s} 天）</div><div class="badges">${MS_STREAK.map(m=>badge(A[`s:${x.id}:${m}`],'🔥',m+'天',`${Math.min(s,m)}/${m}`)).join('')}</div>`}<div class="bsub muted">累計完成（目前 ${t} 次）</div><div class="badges">${MS_TOTAL.map(m=>badge(A[`t:${x.id}:${m}`],'🏅',m+'次',`${Math.min(t,m)}/${m}`)).join('')}</div></div>`});

/* timer */
const T={r:null,i:0,left:0,end:0,running:false,iv:null,fin:[]};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.5)}catch(e){}if(navigator.vibrate)navigator.vibrate(200)}
function startRoutine(id){
  const r=S.cfg.routines.find(x=>x.id===id);
  T.r={...r,steps:r.steps.filter(s=>H(s.hid))};if(!T.r.steps.length)return;
  T.i=0;T.fin=[];T.left=T.r.steps[0].sec*1000;T.running=true;T.end=Date.now()+T.left;
  $('#timer').classList.add('open');tickLoop();drawTimer();
}
function tickLoop(){clearInterval(T.iv);T.iv=setInterval(()=>{if(!T.running)return;T.left=Math.max(0,T.end-Date.now());if(T.left<=0){beep();stepDone(true);return}drawTimerClock()},250)}
function stepDone(markIt){
  const s=T.r.steps[T.i],h=H(s.hid),today=todayS();
  if(markIt&&h){
    if(h.type==='check'){if(!isDone(h,getVal(today,h.id)))setVal(today,h.id,makeCheck(h,{l:lvOn(h)?1:undefined}))}
    else if(h.type==='count'){const v=Number(getVal(today,h.id))||0;setVal(today,h.id,v+1)}
    T.fin.push(T.i);
  }
  T.i++;

function habitMonthStats(h,ym){
  const [y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate(),today=todayS();
  let sched=0,done=0,best=0,run=0,vals=[],lv=[0,0,0,0];
  for(let i=1;i<=n;i++){
    const d=ym+'-'+pad(i);if(d>today)break;
    const v=getVal(d,h.id);
    const tv=trackVal(h,v);if(tv!==undefined&&tv!==null&&tv!=='')vals.push({d:i,v:tv});
    if(lvOn(h)){const o=cv(v);if(o&&o.d)lv[o.l||1]++}
    if(isDone(h,v))done++;
    if((h.repeat||{}).mode!=='weekly'&&scheduled(h,d)){sched++;if(isDone(h,v)){run++;best=Math.max(best,run)}else run=0}
  }
  if((h.repeat||{}).mode==='weekly'){
    const days=Math.min(n,ym===ymOf(today)?pd(today).getDate():n);
    let start=1;if(h.createdAt&&ymOf(h.createdAt)===ym)start=pd(h.createdAt).getDate();
    const effDays=Math.max(0,days-start+1);
    sched=Math.max(1,Math.round((h.repeat.n||1)*effDays/7));done=Math.min(done,sched);
  }
  return {sched,done,rate:sched?done/sched:0,best,vals,lv};
}
const t2m=t=>{const[a,b]=String(t).split(':').map(Number);return a*60+b};
const m2t=m=>pad(Math.floor(m/60))+':'+pad(Math.round(m%60));
function lineChart(points,{h=120,yFmt=v=>v,color='var(--accent)',goal,max,min}={}){
  if(points.length<2)return `<p class="muted" style="font-size:.88rem">再多記錄幾天就能看到趨勢</p>`;
  const W=320,pad_=24,xs=points.map(p=>p.x),ys=points.map(p=>p.y);
  let lo=min??Math.min(...ys,goal??Infinity),hi=max??Math.max(...ys,goal??-Infinity);if(lo===hi){lo-=1;hi+=1}
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const X=x=>pad_+(x1===x0?0:(x-x0)/(x1-x0))*(W-pad_*2),Y=y=>h-18-(y-lo)/(hi-lo)*(h-34);
  const path=points.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=path+` L${X(x1)} ${h-18} L${X(x0)} ${h-18} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="趨勢圖"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${goal!==undefined?`<line x1="${pad_}" x2="${W-pad_}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-pad_}" y="${Y(goal)-4}" text-anchor="end" font-size="10" fill="var(--muted)">目標 ${yFmt(goal)}</text>`:''}
    <path d="${area}" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="var(--surface)" stroke="${color}" stroke-width="2"/>`).join('')}
    <text x="${pad_}" y="${h-3}" font-size="10" fill="var(--muted)">${points[0].label??x0}</text><text x="${W-pad_}" y="${h-3}" font-size="10" fill="var(--muted)" text-anchor="end">${points[points.length-1].label??x1}</text>
    <text x="2" y="${Y(hi)+4}" font-size="10" fill="var(--muted)">${yFmt(hi)}</text><text x="2" y="${Y(lo)+4}" font-size="10" fill="var(--muted)">${yFmt(lo)}</text></svg>`;
}

  const gk=Object.keys(grp);

  const data=JSON.stringify({cfg:S.cfg,logs,exportedAt:new Date().toISOString()},null,1);
  const name='my-routine-'+todayS()+'.json';
  const file=new File([data],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    S.cfg.settings.lastExport=todayS();saveCfg();render();toast('已匯出備份');
  }catch(e){if(e&&e.name!=='AbortError')toast('匯出失敗')}
}
/* ============ sheet ============ */
function openSheet(html,bind){const sh=$('#sheet');sh.innerHTML=html;sh.scrollTop=0;$('#scrim').classList.add('open');bind&&bind(sh)}
function closeSheet(){$('#scrim').classList.remove('open');$('#sheet').onclick=null}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ render + events ============ */
function render(){
  applyTheme();renderNav();
  const t=S.ui.tab;
  $('#app').innerHTML=t==='today'?renderToday():t==='routine'?renderRoutines():t==='stats'?renderStats():renderSettings();
}
async function ensureMonthsFor(date){const need=monthsBack(ymOf(date),2).filter(k=>!S.logs[k]);if(need.length){await Promise.all(need.map(loadMonth));render()}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return;S.ui.tab=b.dataset.nav;render();window.scrollTo(0,0)});
$('#fab').addEventListener('click',()=>{
  if(S.ui.tab==='routine')return openRoutineEditor();
  if(S.ui.todayTab==='todos'){const i=$('#todoIn');i&&i.focus();return}
  openHabitEditor();
});
$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,D=b.dataset;
  switch(a){
    case 'selDay':S.ui.sel=D.date;render();ensureMonthsFor(D.date);break;
    case 'week':S.ui.sel=addD(S.ui.sel,Number(D.d));render();ensureMonthsFor(S.ui.sel);break;
    case 'gotoToday':S.ui.sel=todayS();render();break;
    case 'todayTab':S.ui.todayTab=D.v;render();break;
    case 'cf':S.ui.cf=S.ui.cf===D.v?null:D.v;render();break;
    case 'log':if(lpFired){lpFired=false;break}doLog(D.id);break;
    case 'edit':openHabitEditor(D.id);break;
    case 'newHabit':openHabitEditor();break;
    case 'starter':{const i=Number(D.i);S.ui.starter.has(i)?S.ui.starter.delete(i):S.ui.starter.add(i);render();break}
    case 'addStarters':[...S.ui.starter].sort().forEach((i,k)=>{const s=STARTERS[i];S.cfg.habits.push({id:uid(),color:HCOLORS[k%HCOLORS.length],repeat:{mode:'daily'},group:'',category:'',target:1,unit:'',duration:3,importance:1,showStreak:true,highlight:false,createdAt:todayS(),order:S.cfg.habits.length,...clone(s)})});S.ui.starter.clear();saveCfg();render();toast('已加入，點名稱可以調整設定');break;
    case 'addTodo':{const i=$('#todoIn');const v=i.value.trim();if(!v)return;S.cfg.todos.push({id:uid(),title:v,date:S.ui.sel,done:false});saveCfg();render();$('#todoIn').focus();break}
    case 'toggleTodo':{const t=S.cfg.todos.find(x=>x.id===D.id);t.done=!t.done;saveCfg();render();break}
    case 'delTodo':S.cfg.todos=S.cfg.todos.filter(x=>x.id!==D.id);saveCfg();render();break;
    case 'moveOverdue':S.cfg.todos.forEach(t=>{if(t.date<todayS()&&!t.done)t.date=todayS()});saveCfg();render();break;
    case 'newRoutine':openRoutineEditor();break;
    case 'editRoutine':openRoutineEditor(D.id);break;
    case 'startRoutine':startRoutine(D.id);break;
    case 'rtog':{const r=S.cfg.routines.find(x=>x.id===D.id);if(r){r.collapsed=!r.collapsed;saveCfg();render()}break}
    case 'rinfo':openSheet(`<div class="grab"></div><div class="sh-head"><h2>什麼是作息？</h2><button class="iconbtn" data-x aria-label="關閉">✕</button></div>${routineInfoHTML()}<button class="btn block" data-x style="margin-top:14px">知道了</button>`,sh=>{sh.onclick=e=>{if(e.target.closest('[data-x]'))closeSheet()}});break;
    case 'statsMode':S.ui.statsMode=D.v;render();break;
    case 'statsMonth':{const [y,m]=S.ui.statsMonth.split('-').map(Number);const d=new Date(y,m-1+Number(D.d),1);S.ui.statsMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);await Promise.all(monthsBack(S.ui.statsMonth,2).map(loadMonth));render();break}
    case 'accent':S.cfg.settings.accent=D.v;saveCfg();render();break;
    case 'set':S.cfg.settings[D.k]=D.k==='weekStart'?Number(D.v):D.v;saveCfg();render();break;
    case 'liAdd':{const k=D.kind,v=$('#new-'+k).value.trim();if(!v||S.cfg[k].includes(v))return;S.cfg[k].push(v);saveCfg();render();break}
    case 'liDel':{const k=D.kind,f=k==='groups'?'group':'category',g=S.cfg[k][D.i];if(!confirm(`刪除「${g}」？使用它的習慣會變成不指定。`))return;S.cfg[k].splice(D.i,1);S.cfg.habits.forEach(h=>{if(h[f]===g)h[f]=''});if(S.ui.cf===g)S.ui.cf=null;saveCfg();render();break}
    case 'liUp':{const k=D.kind,i=Number(D.i);if(i>0){const G=S.cfg[k];[G[i-1],G[i]]=[G[i],G[i-1]];saveCfg();render()}break}
    case 'hUp':{const list=activeHabits().sort((a,b)=>(a.order||0)-(b.order||0));const i=list.findIndex(h=>h.id===D.id);if(i>0){[list[i-1],list[i]]=[list[i],list[i-1]];list.forEach((h,k)=>h.order=k);saveCfg();render()}break}
    case 'unarch':H(D.id).archived=false;saveCfg();render();break;
    case 'export':exportData();break;
  }
});
let lpT=null,lpFired=false;
$('#app').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-act="log"]');if(!b)return;const h=H(b.dataset.id);lpFired=false;clearTimeout(lpT);
  if(!h||!lvOn(h))return;
  lpT=setTimeout(()=>{lpFired=true;if(navigator.vibrate)navigator.vibrate(30);if(S.ui.sel>todayS()){toast('還沒到這一天');return}openCheckSheet(h)},450)});
['pointerup','pointercancel'].forEach(ev=>$('#app').addEventListener(ev,()=>clearTimeout(lpT)));
window.addEventListener('scroll',()=>clearTimeout(lpT),{passive:true});
$('#app').addEventListener('contextmenu',e=>{if(e.target.closest('[data-act="log"]'))e.preventDefault()});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='todoIn'){e.preventDefault();$('[data-act="addTodo"]').click()}if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('new-')){e.target.nextElementSibling.click()}});
$('#app').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.li!==undefined){const k=t.dataset.kind,f=k==='groups'?'group':'category',i=Number(t.dataset.li),old=S.cfg[k][i],nv=t.value.trim();if(!nv||S.cfg[k].includes(nv)){t.value=old;return}S.cfg[k][i]=nv;S.cfg.habits.forEach(h=>{if(h[f]===old)h[f]=nv});if(S.ui.cf===old)S.ui.cf=nv;saveCfg();render()}
  if(t.dataset.sel==='ff'){S.ui.ff=t.value;render()}
  if(t.id==='accentPick'){S.cfg.settings.accent=t.value;saveCfg();render()}
  if(t.id==='importIn'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!Array.isArray(d.cfg.habits))throw 0;if(!confirm('匯入會覆蓋目前的習慣與紀錄，確定嗎？'))return;S.cfg=Object.assign(clone(DEFAULT_CFG),d.cfg);S.cfg.settings=Object.assign(clone(DEFAULT_CFG.settings),d.cfg.settings||{});saveCfg();Object.entries(d.logs||{}).forEach(([k,v])=>{S.logs[k]={days:v.days||{}};saveMonth(k)});render();toast('已匯入備份')}catch(err){toast('檔案格式不正確')}};r.readAsText(t.files[0])}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ui.tab==='today'){const t=todayS();if(ymOf(t)!==ymOf(S.ui.sel))ensureMonthsFor(t);render()}});

/* ============ boot ============ */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
function migrate(){
  if((S.cfg.v||1)>=3)return;
  const M={'⚖️減重':'💪健康管理','🌱自我提升':'📚學習成長','📚學習/工作':'📚學習成長'};
  S.cfg.categories=[...new Set((S.cfg.categories||[]).map(c=>M[c]||c))];
  S.cfg.habits.forEach(h=>{if(M[h.category])h.category=M[h.category]});
  if(S.ui.cf&&M[S.ui.cf])S.ui.cf=M[S.ui.cf];
  S.cfg.v=3;saveCfg();
}
function migrate4(){
  if((S.cfg.v||1)>=4)return;
  const G=S.cfg.groups;
  if(G.includes('飯後')&&!G.includes('中午')){G[G.indexOf('飯後')]='中午';S.cfg.habits.forEach(h=>{if(h.group==='飯後')h.group='中午'});S.cfg.routines.forEach(r=>{if(r.group==='飯後')r.group='中午'})}
  if(!G.includes('晚上')){const i=G.indexOf('睡前');i<0?G.push('晚上'):G.splice(i,0,'晚上')}
  if(!G.includes('通勤'))G.push('通勤');
  S.cfg.v=4;saveCfg();
}
async function loadAll(){const t=todayS();const first=S.cfg.habits.reduce((a,h)=>h.createdAt&&h.createdAt<a?h.createdAt:a,t);let [y,m]=ymOf(first).split('-').map(Number);const [ty,tm]=ymOf(t).split('-').map(Number);const out=[];while(y<ty||(y===ty&&m<=tm)){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++}}await Promise.all(out.map(loadMonth))}
(async function boot(){
  const c=Store.localGet('config');
  if(c){S.cfg=Object.assign(clone(DEFAULT_CFG),c);S.cfg.settings=Object.assign(clone(DEFAULT_CFG.settings),c.settings||{})}
  monthsBack(ymOf(todayS()),3).forEach(k=>S.logs[k]=Store.localGet('log-'+k)||{days:{}});
  migrate();migrate4();
  await loadAll();
  render();
  await Store.init();
  if(Store.cloud){
    const cc=await Store.cloudGet('config');
    if(cc){S.cfg=Object.assign(clone(DEFAULT_CFG),cc);S.cfg.settings=Object.assign(clone(DEFAULT_CFG.settings),cc.settings||{});Store.localSet('config',S.cfg)}
    else if(cc===null&&c){saveCfg()}
    const yms=monthsBack(ymOf(todayS()),3);yms.forEach(k=>delete S.logs[k]);
    await Promise.all(yms.map(loadMonth));
    render();
  }
  checkAch();
})();
</script>
